name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esg
          POSTGRES_PASSWORD: esg_test
          POSTGRES_DB: esg_scrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install psycopg2-binary requests

      - name: Run linting
        run: |
          ruff check src/ tests/ --ignore E501 || true

      - name: Run tests (SQLite)
        env:
          JWT_SECRET: test-secret-key-minimum-32-bytes!!
        run: |
          pytest tests/ -v --tb=short

      - name: Run tests (PostgreSQL)
        env:
          JWT_SECRET: test-secret-key-minimum-32-bytes!!
          DATABASE_URL: postgresql://esg:esg_test@localhost:5432/esg_scrm_test
        run: |
          pytest tests/ -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t esg-scrm:ci .

      - name: Test Docker compose
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120
          sleep 10
          curl -f http://localhost:8000/api/health || exit 1
          docker compose down -v
