name: CI

on:
  push:
    branches: [main, chore/coc-sync-2026-05-20]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: |
          ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: |
          mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esg
          POSTGRES_PASSWORD: esg_test
          POSTGRES_DB: esg_scrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install psycopg2-binary requests

      - name: Run tests (SQLite)
        env:
          JWT_SECRET: test-secret-key-minimum-32-bytes!!
        run: |
          pytest tests/ -x --tb=short

      - name: Run tests (PostgreSQL)
        env:
          JWT_SECRET: test-secret-key-minimum-32-bytes!!
          DATABASE_URL: postgresql://esg:esg_test@localhost:5432/esg_scrm_test
        run: |
          pytest tests/ -x --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm ci

      - name: Build frontend
        run: |
          cd apps/web
          npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [test, frontend-build]
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: |
          cd apps/web
          npx playwright install chromium --with-deps

      - name: Start backend
        run: |
          cp .env.example .env
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/dashboard/live > /dev/null 2>&1 && echo "Backend ready" && break
            sleep 1
          done

      - name: Start frontend
        run: |
          cd apps/web
          npm run dev -- --port 5173 &
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null 2>&1 && echo "Frontend ready" && break
            sleep 1
          done

      - name: Run E2E tests
        env:
          E2E_API_URL: http://localhost:8000
          E2E_BASE_URL: http://localhost:5173
        run: |
          cd apps/web
          npx playwright test --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, frontend-build, e2e]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t esg-scrm:ci .

      - name: Test Docker compose
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120
          sleep 10
          curl -f http://localhost:8000/api/health || exit 1
          docker compose down -v
